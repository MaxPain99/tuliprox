name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-musl:
    name: Build x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Apply MaxPain patches (Flussonic catchup + Hide Adult)
        run: |
          set -euo pipefail
          chmod +x scripts/apply-maxpain-flussonic.sh
          ./scripts/apply-maxpain-flussonic.sh .
          echo "Applied: m3u-flussonic-tivimate.patch, user-hide-adult.patch"
          echo "Note: EPG url-tvg and EXTVLCOPT are now upstream in v3.3.74+"

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust (stable) with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Rust tools for frontend
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,wasm-bindgen-cli,mdbook

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm tools
        run: |
          chmod +x ./bin/install_wasm_tools.sh
          WASM_TOOLS_BIN="$(./bin/install_wasm_tools.sh 128)"
          echo "${WASM_TOOLS_BIN}" >> "$GITHUB_PATH"

      - name: Test Flussonic archive + catchup deltas
        run: |
          cargo test -p tuliprox parses_flat_tivimate_hls_archive --locked
          cargo test -p tuliprox resolve_default_mode_query_template_keeps_base_stream_url --locked
          cargo test -p tuliprox leaked_dvr_relative_joins_against_media_playlist --locked
          cargo test -p tuliprox adult_group_matcher_covers_bittv_style_names --locked

      - name: Build frontend
        run: |
          chmod +x ./bin/build_docs.sh ./bin/build_fe.sh
          ./bin/build_fe.sh release

      - name: Build release binary (musl)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package artifact
        run: |
          TAG="${GITHUB_REF_NAME}"
          OUT="tuliprox-${TAG}-x86_64-unknown-linux-musl"
          mkdir -p "dist/${OUT}"

          # Бинарь
          cp target/x86_64-unknown-linux-musl/release/tuliprox "dist/${OUT}/"

          # Web-панель — trunk кладёт результат в frontend/dist/
          cp -r frontend/dist "dist/${OUT}/web"

          tar -C dist -czf "${OUT}.tar.gz" "${OUT}"
          echo "Archive contents:"
          tar -tzf "${OUT}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: tuliprox-x86_64-unknown-linux-musl
          path: "*.tar.gz"

  release:
    name: Publish GitHub Release
    needs: build-musl
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: tuliprox-x86_64-unknown-linux-musl
          path: artifacts

      - name: Create / update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG" artifacts/* \
              --repo "$GH_REPO" \
              --title "$TAG" \
              --notes "Release ${TAG} (MaxPain: Flussonic catchup deltas + Hide Adult; url-tvg & EXTVLCOPT are upstream)"
          fi
